name: Build Miatoll Imperial-X
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Forces the entire compilation to run inside a safe, legacy-compatible container environment
    container:
      image: ubuntu:20.04
      env:
        DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Install Container Core Dependencies
        run: |
          apt-get update && apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib git \
            gnupg gperf lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev \
            libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool \
            squashfs-tools xsltproc zip zlib1g-dev libtinfo5 libelf-dev python2 python3

      - name: Clone Legacy Toolchain (Proton Clang 13)
        run: |
          git clone https://github.com/kdrag0n/proton-clang.git --depth=1 $GITHUB_WORKSPACE/toolchain

      - name: Clone Kernel Source
        run: |
          git clone https://github.com/RiteshSahany/kernel_xiaomi_sm6250 --depth=1 $GITHUB_WORKSPACE/kernel

      - name: Set up KernelSU
        run: |
          cd $GITHUB_WORKSPACE/kernel
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -

      - name: Inject SUSFS 4.14 Patches
        run: |
          cd $GITHUB_WORKSPACE
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android12-5.10 susfs
          cd kernel
          cp ../susfs/kernel_patches/5.y/* ./ 2>/dev/null || true
          cp ../susfs/kernel_patches/fs/* ./fs/ 2>/dev/null || true
          cp ../susfs/kernel_patches/include/linux/* ./include/linux/ 2>/dev/null || true
          echo "CONFIG_SUSFS=y" >> arch/arm64/configs/vendor/miatoll_defconfig
          echo "CONFIG_SUSFS_SUS_PATH_HIDE=y" >> arch/arm64/configs/vendor/miatoll_defconfig
          echo "CONFIG_SUSFS_TRY_UMOUNT=y" >> arch/arm64/configs/vendor/miatoll_defconfig

      - name: Resolve Core Code Clashes
        run: |
          cd $GITHUB_WORKSPACE/kernel
          # Strip the rigid tracepoint cpu checks out of existence
          sed -i 's/#error "Unsupported NR_CPUS for lb tracepoint."/\/\/ Removed tracepoint block/g' include/trace/events/sched.h
          # Inject the scheduler requirements for KernelSU hooks to function cleanly
          echo "CONFIG_NO_HZ_COMMON=y" >> arch/arm64/configs/vendor/miatoll_defconfig
          echo "CONFIG_NO_HZ_FULL=y" >> arch/arm64/configs/vendor/miatoll_defconfig
          echo "CONFIG_NO_HZ=y" >> arch/arm64/configs/vendor/miatoll_defconfig

      - name: Compile Patch-Free Kernel
        run: |
          cd $GITHUB_WORKSPACE/kernel
          
          export PATH="$GITHUB_WORKSPACE/toolchain/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          
          rm -rf out
          
          # Initialize matching configuration rules using precise standard targets
          make O=out vendor/miatoll_defconfig CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          # Fire off blazing-fast multi-core build processing without triggering modern syntax traps
          make -j$(nproc --all) O=out \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Pack with AnyKernel3
        run: |
          cd $GITHUB_WORKSPACE
          git clone https://github.com/osm0sis/AnyKernel3.git --depth=1 AnyKernel3
          if [ -f kernel/out/arch/arm64/boot/Image.gz-dtb ]; then
            cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          elif [ -f kernel/out/arch/arm64/boot/Image.gz ]; then
            cp kernel/out/arch/arm64/boot/Image.gz AnyKernel3/
          else
            cp kernel/out/arch/arm64/boot/Image AnyKernel3/
          fi
          cd AnyKernel3
          # Using standard portable compression zip paths inside container workspace
          zip -r9 ../ImperialX-Miatoll-KSU-SUSFS.zip *

      - name: Upload Flashable Kernel
        uses: actions/upload-artifact@v4
        with:
          name: ImperialX-Miatoll-KSU-SUSFS
          path: ImperialX-Miatoll-KSU-SUSFS.zip
