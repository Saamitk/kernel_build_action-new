name: Build Miatoll Imperial-X
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 4096
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev libtinfo5

      - name: Clone Toolchains (GCC & Public AOSP Clang Mirror)
        run: |
          mkdir -p $GITHUB_WORKSPACE/toolchains
          cd $GITHUB_WORKSPACE/toolchains
          # Double checking depth parameters to pull compiler packages at maximum speeds
          git clone https://github.com/mvaisakh/gcc-arm64.git --depth=1 gcc64
          git clone https://github.com/mvaisakh/gcc-arm.git --depth=1 gcc32
          # Swapped the broken GitLab repo for a permanent, public Git mirror of official AOSP Clang
          git clone https://github.com/LineageOS/android_prebuilts_clang_host_linux-x86_clang-r450784d.git --depth=1 clang

      - name: Clone Kernel Source
        run: |
          git clone https://github.com/RiteshSahany/kernel_xiaomi_sm6250 --depth=1 $GITHUB_WORKSPACE/kernel

      - name: Set up KernelSU
        run: |
          cd $GITHUB_WORKSPACE/kernel
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -

      - name: Inject SUSFS 4.14 Patches
        run: |
          cd $GITHUB_WORKSPACE
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android12-5.10 susfs
          cd kernel
          cp ../susfs/kernel_patches/5.y/* ./ 2>/dev/null || true
          cp ../susfs/kernel_patches/fs/* ./fs/ 2>/dev/null || true
          cp ../susfs/kernel_patches/include/linux/* ./include/linux/ 2>/dev/null || true
          echo "CONFIG_SUSFS=y" >> arch/arm64/configs/vendor/miatoll_defconfig
          echo "CONFIG_SUSFS_SUS_PATH_HIDE=y" >> arch/arm64/configs/vendor/miatoll_defconfig
          echo "CONFIG_SUSFS_TRY_UMOUNT=y" >> arch/arm64/configs/vendor/miatoll_defconfig

      - name: Compile Kernel
        run: |
          cd $GITHUB_WORKSPACE/kernel
          
          # Map all toolchain paths accurately into the shell runtime environment
          export PATH="$GITHUB_WORKSPACE/toolchains/clang/bin:$GITHUB_WORKSPACE/toolchains/gcc64/bin:$GITHUB_WORKSPACE/toolchains/gcc32/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          
          rm -rf out
          
          # Building defconfig configurations using the explicit architectural binaries
          make O=out vendor/miatoll_defconfig CC=clang CROSS_COMPILE=aarch64-elf- CROSS_COMPILE_ARM32=arm-eabi-
          
          # Trigger compilation targets with explicit cross references to stop Error 2 linkage failures
          make -j$(nproc --all) O=out \
            CC=clang \
            CROSS_COMPILE=aarch64-elf- \
            CROSS_COMPILE_ARM32=arm-eabi- \
            CLANG_TRIPLE=aarch64-linux-gnu-

      - name: Pack with AnyKernel3
        run: |
          cd $GITHUB_WORKSPACE
          git clone https://github.com/osm0sis/AnyKernel3.git --depth=1 AnyKernel3
          if [ -f kernel/out/arch/arm64/boot/Image.gz-dtb ]; then
            cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          elif [ -f kernel/out/arch/arm64/boot/Image.gz ]; then
            cp kernel/out/arch/arm64/boot/Image.gz AnyKernel3/
          else
            cp kernel/out/arch/arm64/boot/Image AnyKernel3/
          fi
          cd AnyKernel3
          zip -r9 ../ImperialX-Miatoll-KSU-SUSFS.zip *

      - name: Upload Flashable Kernel
        uses: actions/upload-artifact@v4
        with:
          name: ImperialX-Miatoll-KSU-SUSFS
          path: ImperialX-Miatoll-KSU-SUSFS.zip
