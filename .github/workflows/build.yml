name: Build Kernel
on:
  workflow_dispatch:

jobs:
  Build-Kernel:
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Build Kernel With KSU and SUSFS
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://github.com/RiteshSahany/kernel_xiaomi_miatoll
          kernel-dir: msm-4.14
          kernel-branch: fourteen
          config: miatoll_defconfig
          arch: arm64
          # We turn off standard AOSP downloading to bypass the 400 error
          aosp-gcc: false
          aosp-clang: false
          # We tell it to pull a custom, highly reliable toolchain instead
          custom-toolchain: https://github.com/ZyCromerZ/Clang/releases/download/14.0.6-20230214-release/ZyC_Clang-14.0.6-20230214.tar.gz
          ksu: true
          ksu-version: main
          disable-lto: true
          anykernel3: true
          
      - name: Inject SUSFS 4.14 Patches
        run: |
          cd msm-4.14
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android12-5.10 ../susfs4ksu
          cp ../susfs4ksu/kernel_patches/5.y/* ./ 2>/dev/null || true
          cp ../susfs4ksu/kernel_patches/fs/* ./fs/ 2>/dev/null || true
          cp ../susfs4ksu/kernel_patches/include/linux/* ./include/linux/ 2>/dev/null || true
          echo "CONFIG_SUSFS=y" >> arch/arm64/configs/vendor/miatoll_defconfig
          echo "CONFIG_SUSFS_SUS_PATH_HIDE=y" >> arch/arm64/configs/vendor/miatoll_defconfig
          echo "CONFIG_SUSFS_TRY_UMOUNT=y" >> arch/arm64/configs/vendor/miatoll_defconfig
          
